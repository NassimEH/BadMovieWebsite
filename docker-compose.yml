services:
  db:
    image: postgres:15-alpine
    container_name: badmovie_db
    environment:
      POSTGRES_USER: badmovie
      POSTGRES_PASSWORD: badmovie
      POSTGRES_DB: badmovie
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - badmovie-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badmovie"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: badmovie_app
    ports:
      - "5000:5000"
    volumes:
      - ./static:/app/static
      - ./templates:/app/templates
      - ./routes:/app/routes
      - ./controllers:/app/controllers
    env_file:
      - .env
    environment:
      - FLASK_APP=app.py
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://badmovie:badmovie@db:5432/badmovie
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - badmovie-network

volumes:
  postgres_data:

networks:
  badmovie-network:
    driver: bridge
